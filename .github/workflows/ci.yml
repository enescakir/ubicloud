name: CI

on:
  workflow_dispatch:
    inputs:
      size_mb:
        default: "1024"
      mode:
        description: all, speed, netdiag, or probe
        default: all

permissions:
  contents: read

env:
  SIZE_MB: ${{ inputs.size_mb || '1024' }}

jobs:
  netdiag:
    if: inputs.mode == 'all' || inputs.mode == 'netdiag'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm]
        n: [1, 2]
    runs-on: ${{ matrix.arch == 'arm' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    env:
      KEY: netdiag-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}-${{ matrix.n }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -c '.[-1]' /home/runner/actions-runner/.setup_info || true
          echo "ipv4=$(curl -4 -sS --max-time 5 https://ifconfig.me || echo none) ipv6=$(curl -6 -sS --max-time 5 https://ifconfig.me || echo none)"
          ip -br addr; ip route; ip -6 route
      - name: Install tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mtr-tiny traceroute dnsutils > /dev/null
      - name: Make small blob
        run: mkdir -p blob && head -c 1M /dev/urandom > blob/data.bin
      - name: Save small entry
        uses: actions/cache/save@v4
        with:
          path: blob
          key: ${{ env.KEY }}
      - name: Find R2 host
        run: |
          set -a; . /etc/environment; set +a
          auth="Authorization: Bearer: $UBICLOUD_RUNTIME_TOKEN"
          version=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}caches?key=$KEY" | jq -r '.artifactCaches[0].cacheVersion')
          url=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}cache?keys=$KEY&version=$version&runId=$GITHUB_RUN_ID" | jq -r .archiveLocation)
          host=$(echo "$url" | cut -d/ -f3)
          echo "::add-mask::${host%%.*}"
          echo "R2_HOST=$host" >> "$GITHUB_ENV"
          echo "R2 host suffix: ${host#*.}"
      - name: DNS
        run: |
          echo "--- resolv.conf"; grep -v '^#' /etc/resolv.conf
          resolvectl status 2>/dev/null | grep -E "DNS Server|Current DNS|Protocols" || true
          for r in "" @1.1.1.1 @8.8.8.8 @2606:4700:4700::1111; do
            for t in A AAAA; do
              echo "$t ${r:-local}: $(dig $r +time=3 +tries=1 +noall +answer +stats "$R2_HOST" $t | grep -E "IN|Query time" | awk '{print}' ORS=' | ')"
            done
          done
          echo "--- Cloudflare resolver location (CH TXT id.server)"
          dig @1.1.1.1 +short CH TXT id.server || true
          echo "--- edge colo per family"
          for f in 4 6; do
            echo "R2 IPv$f: $(curl -$f -sS --max-time 10 "https://$R2_HOST/cdn-cgi/trace" | grep -E '^(ip|colo|http|tls|warp)=' | tr '\n' ' ')"
            echo "nodejs IPv$f: $(curl -$f -sS --max-time 10 https://nodejs.org/cdn-cgi/trace | grep -E '^(colo|http)=' | tr '\n' ' ')"
          done
      - name: Connection timing
        run: |
          for f in 4 6; do
            for i in 1 2 3 4 5; do
              curl -$f -sS -o /dev/null --max-time 15 -w "R2 IPv$f %{remote_ip} dns=%{time_namelookup} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} code=%{http_code}\n" "https://$R2_HOST/" || true
            done
          done
      - name: Ping
        run: |
          for f in 4 6; do
            ping -$f -c 30 -i 0.2 -q "$R2_HOST" 2>&1 | tail -2 || true
            ping -$f -c 30 -i 0.2 -q nodejs.org 2>&1 | tail -2 || true
          done
      - name: MTR TCP 443
        run: |
          for f in 4 6; do
            echo "=== R2 IPv$f"; sudo mtr -$f -T -P 443 -n -b -r -w -c 30 "$R2_HOST" || true
            echo "=== nodejs.org IPv$f"; sudo mtr -$f -T -P 443 -n -b -r -w -c 30 nodejs.org || true
          done
      - name: Traceroute with AS numbers
        run: |
          for f in 4 6; do
            echo "=== R2 IPv$f"; sudo traceroute -$f -T -p 443 -A -q 1 -w 2 "$R2_HOST" || true
          done

  seed:
    if: inputs.mode == 'all' || inputs.mode == 'speed'
    strategy:
      matrix:
        arch: [x64, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    env:
      KEY: speedtest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -c '.[-1]' /home/runner/actions-runner/.setup_info || true
          echo "ipv4=$(curl -4 -sS --max-time 5 https://ifconfig.me || echo none) ipv6=$(curl -6 -sS --max-time 5 https://ifconfig.me || echo none)"
      - name: Make blob
        run: mkdir -p blob && head -c "${SIZE_MB}M" /dev/urandom > blob/data.bin && ls -l blob
      - name: Save
        uses: actions/cache/save@v4
        with:
          path: blob
          key: ${{ env.KEY }}

  restore:
    if: inputs.mode == 'all' || inputs.mode == 'speed'
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm]
        n: [1, 2, 3]
    runs-on: ${{ matrix.arch == 'arm' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}
    timeout-minutes: 40
    env:
      KEY: speedtest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -c '.[-1]' /home/runner/actions-runner/.setup_info || true
          echo "ipv4=$(curl -4 -sS --max-time 5 https://ifconfig.me || echo none) ipv6=$(curl -6 -sS --max-time 5 https://ifconfig.me || echo none)"
          systemctl status cache-proxy --no-pager | head -5 || true
      - name: Cloudflare edge baseline
        run: |
          u=https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          for f in 4 6; do
            curl -$f -sS -o /dev/null --max-time 60 -D /tmp/h -w "EDGE IPv$f %{remote_ip} %{size_download}B %{speed_download}B/s %{time_total}s" "$u" || true
            echo " $(grep -i cf-ray /tmp/h | tr -d '\r')"
          done
      - name: Restore start
        run: echo "RESTORE_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Restore through cache-proxy
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: ${{ env.KEY }}
          fail-on-cache-miss: true
      - name: Restore result
        run: |
          end=$(date +%s.%N)
          bytes=$(stat -c %s blob/data.bin)
          awk -v s="$RESTORE_START" -v e="$end" -v b="$bytes" 'BEGIN { printf "PROXY_RESTORE %d bytes %.1f s %.1f MB/s (includes zstd/tar)\n", b, e-s, b/(e-s)/1e6 }'
      - name: Direct R2 download (no proxy)
        run: |
          set -a; . /etc/environment; set +a
          auth="Authorization: Bearer: $UBICLOUD_RUNTIME_TOKEN"
          version=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}caches?key=$KEY" | jq -r '.artifactCaches[0].cacheVersion')
          url=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}cache?keys=$KEY&version=$version&runId=$GITHUB_RUN_ID" | jq -r .archiveLocation)
          host=$(echo "$url" | cut -d/ -f3)
          echo "R2 host A: $(dig +short A "$host" | tr '\n' ' ') AAAA: $(dig +short AAAA "$host" | tr '\n' ' ')"
          for f in 4 6 4 6; do
            curl -$f -sS -o /dev/null --max-time 300 -D /tmp/h -w "R2 IPv$f %{remote_ip} %{size_download}B %{speed_download}B/s ttfb=%{time_starttransfer}s total=%{time_total}s" "$url" || true
            echo " $(grep -i cf-ray /tmp/h | tr -d '\r')"
          done
          echo "--- 8 parallel ranged GETs, default address family (like the proxy)"
          size=$(curl -sS -r 0-0 -D - -o /dev/null "$url" | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          seg=$(( (size + 7) / 8 ))
          start=$(date +%s.%N)
          for i in 0 1 2 3 4 5 6 7; do
            a=$((i * seg)); b=$(( (i + 1) * seg - 1 )); [ "$b" -ge "$size" ] && b=$((size - 1))
            curl -sS -o /dev/null --max-time 300 -r "$a-$b" -w "seg$i %{remote_ip} %{speed_download}B/s %{time_total}s\n" "$url" &
          done
          wait
          awk -v s="$start" -v e="$(date +%s.%N)" -v b="$size" 'BEGIN { printf "R2_PARALLEL8 %.1f s %.1f MB/s\n", e-s, b/(e-s)/1e6 }'
      - name: cache-proxy log
        if: always()
        run: sudo journalctl -u cache-proxy --no-pager -o cat | grep -v '"Received request"' | sed -E 's/X-Amz-[A-Za-z-]+=[^&" ]*//g' | tail -60 || true

  probe-gen:
    if: inputs.mode == 'probe'
    runs-on: ubicloud-standard-4
    timeout-minutes: 30
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      KEY: probe-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -r '.[-1].detail' /home/runner/actions-runner/.setup_info | grep -E "^(Label|VM Host|Datacenter):" | tr '\n' ' '; echo
      - name: Make blob
        run: mkdir -p blob && head -c 512M /dev/urandom > blob/data.bin
      - name: Save
        uses: actions/cache/save@v4
        with:
          path: blob
          key: ${{ env.KEY }}
      - name: Get presigned URL
        id: url
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
        run: |
          set -a; . /etc/environment; set +a
          auth="Authorization: Bearer: $UBICLOUD_RUNTIME_TOKEN"
          version=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}caches?key=$KEY" | jq -r '.artifactCaches[0].cacheVersion')
          curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}cache?keys=$KEY&version=$version&runId=$GITHUB_RUN_ID" | jq -r .archiveLocation > /tmp/url
          if [ -n "$PROBE_KEY" ]; then
            enc=$(openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PROBE_KEY -a -A -in /tmp/url)
            echo "url=$enc" >> "$GITHUB_OUTPUT"
          else
            echo "PROBE_KEY secret is not set; remote probe skipped"
          fi
      - name: Connection scaling
        run: |
          url=$(cat /tmp/url)
          size=$(curl -sS -r 0-0 -D - -o /dev/null "$url" | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          for n in 1 8 32 64 128; do
            seg=$(( size / n )); start=$(date +%s.%N); rm -f /tmp/seg.*
            for i in $(seq 0 $((n - 1))); do
              a=$((i * seg)); b=$((a + seg - 1))
              curl -sS -o /dev/null --max-time 30 -r "$a-$b" -w "%{size_download}\n" "$url" > /tmp/seg.$i 2>/dev/null &
            done
            wait
            awk -v n="$n" -v s="$start" -v e="$(date +%s.%N)" '{ b += $1 } END { printf "SCALE n=%-3d %.1f s total %.1f MB/s per-conn %.2f MB/s\n", n, e-s, b/(e-s)/1e6, b/(e-s)/1e6/n }' /tmp/seg.*
          done
      - name: Other R2 account (nodejs.org cache miss)
        run: |
          for u in "https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz?cb=$RANDOM$RANDOM" https://nodejs.org/dist/v4.9.1/node-v4.9.1-linux-ppc64le.tar.xz https://nodejs.org/dist/v6.17.1/node-v6.17.1-linux-s390x.tar.xz; do
            curl -sS -o /dev/null -D /tmp/h --max-time 60 -w "NODEJS %{size_download}B %{speed_download}B/s ttfb=%{time_starttransfer} " "$u"
            grep -iE "^(cf-cache-status|cf-ray):" /tmp/h | tr -d '\r' | tr '\n' ' '; echo
          done

  probe-remote:
    if: inputs.mode == 'probe' && needs.probe-gen.outputs.url != ''
    needs: probe-gen
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, ubuntu-22.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          curl -sS --max-time 5 https://ipinfo.io | jq -c '{city, region, country, org}' || true
      - name: Decrypt URL
        env:
          PROBE_KEY: ${{ secrets.PROBE_KEY }}
          ENC: ${{ needs.probe-gen.outputs.url }}
        run: echo "$ENC" | openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PROBE_KEY -a -A > /tmp/url && wc -c < /tmp/url
      - name: Edge colo
        run: |
          host=$(cut -d/ -f3 /tmp/url)
          echo "R2: $(curl -sS --max-time 10 "https://$host/cdn-cgi/trace" | grep -E '^(colo|http)=' | tr '\n' ' ')"
          echo "nodejs: $(curl -sS --max-time 10 https://nodejs.org/cdn-cgi/trace | grep -E '^(colo|http)=' | tr '\n' ' ')"
      - name: Single connection and scaling
        run: |
          url=$(cat /tmp/url)
          for i in 1 2; do
            curl -sS -o /dev/null --max-time 60 -D /tmp/h -w "R2 single %{remote_ip} %{size_download}B %{speed_download}B/s ttfb=%{time_starttransfer}s total=%{time_total}s" "$url" || true
            echo " $(grep -i cf-ray /tmp/h | tr -d '\r')"
          done
          size=$(curl -sS -r 0-0 -D - -o /dev/null "$url" | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          for n in 8 32; do
            seg=$(( size / n )); start=$(date +%s.%N); rm -f /tmp/seg.*
            for i in $(seq 0 $((n - 1))); do
              a=$((i * seg)); b=$((a + seg - 1))
              curl -sS -o /dev/null --max-time 30 -r "$a-$b" -w "%{size_download}\n" "$url" > /tmp/seg.$i 2>/dev/null &
            done
            wait
            awk -v n="$n" -v s="$start" -v e="$(date +%s.%N)" '{ b += $1 } END { printf "SCALE n=%-3d %.1f s total %.1f MB/s per-conn %.2f MB/s\n", n, e-s, b/(e-s)/1e6, b/(e-s)/1e6/n }' /tmp/seg.*
          done
      - name: Other R2 account (nodejs.org cache miss)
        run: |
          for u in "https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz?cb=$RANDOM$RANDOM" https://nodejs.org/dist/v4.9.1/node-v4.9.1-linux-ppc64le.tar.xz; do
            curl -sS -o /dev/null -D /tmp/h --max-time 60 -w "NODEJS %{size_download}B %{speed_download}B/s ttfb=%{time_starttransfer} " "$u"
            grep -iE "^(cf-cache-status|cf-ray):" /tmp/h | tr -d '\r' | tr '\n' ' '; echo
          done
