name: CI

on:
  workflow_dispatch:
    inputs:
      size_mb:
        default: "1024"

permissions:
  contents: read

env:
  SIZE_MB: ${{ inputs.size_mb || '1024' }}

jobs:
  seed:
    strategy:
      matrix:
        arch: [x64, arm]
    runs-on: ${{ matrix.arch == 'arm' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    env:
      KEY: speedtest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -c '.[-1]' /home/runner/actions-runner/.setup_info || true
          echo "ipv4=$(curl -4 -sS --max-time 5 https://ifconfig.me || echo none) ipv6=$(curl -6 -sS --max-time 5 https://ifconfig.me || echo none)"
      - name: Make blob
        run: mkdir -p blob && head -c "${SIZE_MB}M" /dev/urandom > blob/data.bin && ls -l blob
      - name: Save
        uses: actions/cache/save@v4
        with:
          path: blob
          key: ${{ env.KEY }}

  restore:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm]
        n: [1, 2, 3]
    runs-on: ${{ matrix.arch == 'arm' && 'ubicloud-standard-4-arm' || 'ubicloud-standard-4' }}
    timeout-minutes: 40
    env:
      KEY: speedtest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
    steps:
      - name: Runner info
        run: |
          date -u +%FT%TZ
          jq -c '.[-1]' /home/runner/actions-runner/.setup_info || true
          echo "ipv4=$(curl -4 -sS --max-time 5 https://ifconfig.me || echo none) ipv6=$(curl -6 -sS --max-time 5 https://ifconfig.me || echo none)"
          systemctl status cache-proxy --no-pager | head -5 || true
      - name: Cloudflare edge baseline
        run: |
          u=https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
          for f in 4 6; do
            curl -$f -sS -o /dev/null --max-time 60 -D /tmp/h -w "EDGE IPv$f %{remote_ip} %{size_download}B %{speed_download}B/s %{time_total}s" "$u" || true
            echo " $(grep -i cf-ray /tmp/h | tr -d '\r')"
          done
      - name: Restore start
        run: echo "RESTORE_START=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Restore through cache-proxy
        uses: actions/cache/restore@v4
        with:
          path: blob
          key: ${{ env.KEY }}
          fail-on-cache-miss: true
      - name: Restore result
        run: |
          end=$(date +%s.%N)
          bytes=$(stat -c %s blob/data.bin)
          awk -v s="$RESTORE_START" -v e="$end" -v b="$bytes" 'BEGIN { printf "PROXY_RESTORE %d bytes %.1f s %.1f MB/s (includes zstd/tar)\n", b, e-s, b/(e-s)/1e6 }'
      - name: Direct R2 download (no proxy)
        run: |
          set -a; . /etc/environment; set +a
          auth="Authorization: Bearer: $UBICLOUD_RUNTIME_TOKEN"
          version=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}caches?key=$KEY" | jq -r '.artifactCaches[0].cacheVersion')
          url=$(curl -sS -H "$auth" "${UBICLOUD_CACHE_URL}cache?keys=$KEY&version=$version&runId=$GITHUB_RUN_ID" | jq -r .archiveLocation)
          host=$(echo "$url" | cut -d/ -f3)
          echo "R2 host A: $(dig +short A "$host" | tr '\n' ' ') AAAA: $(dig +short AAAA "$host" | tr '\n' ' ')"
          for f in 4 6 4 6; do
            curl -$f -sS -o /dev/null --max-time 300 -D /tmp/h -w "R2 IPv$f %{remote_ip} %{size_download}B %{speed_download}B/s ttfb=%{time_starttransfer}s total=%{time_total}s" "$url" || true
            echo " $(grep -i cf-ray /tmp/h | tr -d '\r')"
          done
          echo "--- 8 parallel ranged GETs, default address family (like the proxy)"
          size=$(curl -sS -r 0-0 -D - -o /dev/null "$url" | tr -d '\r' | awk -F/ 'tolower($0) ~ /^content-range/ {print $2}')
          seg=$(( (size + 7) / 8 ))
          start=$(date +%s.%N)
          for i in 0 1 2 3 4 5 6 7; do
            a=$((i * seg)); b=$(( (i + 1) * seg - 1 )); [ "$b" -ge "$size" ] && b=$((size - 1))
            curl -sS -o /dev/null --max-time 300 -r "$a-$b" -w "seg$i %{remote_ip} %{speed_download}B/s %{time_total}s\n" "$url" &
          done
          wait
          awk -v s="$start" -v e="$(date +%s.%N)" -v b="$size" 'BEGIN { printf "R2_PARALLEL8 %.1f s %.1f MB/s\n", e-s, b/(e-s)/1e6 }'
      - name: cache-proxy log
        if: always()
        run: sudo journalctl -u cache-proxy --no-pager -o cat | grep -v '"Received request"' | sed -E 's/X-Amz-[A-Za-z-]+=[^&" ]*//g' | tail -60 || true
